<!doctype html>
<html lang="hr">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.gstatic.com/firebasejs/ https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com http://127.0.0.1:8080 http://127.0.0.1:9099; frame-src https://par-education.firebaseapp.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Ogledna sesija · PAR Education</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body data-mode="demo">
    <div id="session-gate" class="session-gate" role="status">
      Provjera prijave…
    </div>
    <div id="app" hidden>
      <button
        id="sidebar-overlay"
        class="sidebar-overlay"
        aria-label="Zatvori navigaciju"
        hidden
      ></button>
      <aside id="sidebar" class="sidebar">
        <a class="brand" href="./homepage.html"
          ><span class="brand-mark">PAR<span>·</span></span
          ><span><small>VISOKO UČILIŠTE</small></span></a
        >
        <div class="sidebar-account">
          <span id="account-avatar" class="avatar"></span>
          <div>
            <strong id="account-name"></strong><small id="account-role"></small>
          </div>
          <button
            id="logout"
            class="icon-button"
            title="Odjava"
            aria-label="Odjava"
          >
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
          </button>
        </div>
        <nav id="navigation" aria-label="Glavna navigacija"></nav>
        <a class="sidebar-exit" href="#help"
          ><i class="fa-solid fa-circle-question" aria-hidden="true"></i> Pomoć
          i integracije</a
        >
      </aside>
      <div class="workspace">
        <header class="app-header">
          <div class="header-path">
            <button
              id="menu"
              class="icon-button menu-button"
              aria-label="Otvori navigaciju"
              aria-expanded="false"
            >
              ☰</button
            ><span class="header-search"
              ><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input
                id="global-search"
                type="search"
                aria-label="Pretraži module"
                placeholder="Pretraži ERP…" />
              <div id="global-results" hidden></div></span
            ><span class="muted breadcrumb">/</span
            ><strong class="breadcrumb" id="header-title"
              >Nadzorna ploča</strong
            >
          </div>
          <div class="header-actions">
            <span id="mode-label" class="pill">Firestore</span
            ><button
              id="theme"
              class="icon-button theme-button"
              aria-label="Promijeni temu"
            >
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
          </div>
        </header>
        <main id="content" tabindex="-1"></main>
        <footer class="app-footer">
          PAR Education <span>Interni akademski i administrativni sustav</span>
        </footer>
      </div>
    </div>
    <dialog id="record-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          id="close-dialog"
          class="icon-button"
          aria-label="Zatvori dijalog"
        >
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p class="notice error">
        Za pristup sustavu potrebno je omogućiti JavaScript.
      </p></noscript
    >
    <script type="module" src="./src/demo.js"></script>
  </body>
</html>
